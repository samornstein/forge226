<section id="fc"><style>
#fc{--line:#d9d6ce}#fc .toolbar,#fc .filters,#fc .phases{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#fc .phases{margin:14px 0}#fc button{border-radius:6px}#fc button[aria-pressed=true]{background:#172128;color:white}#fc .heading{font-size:22px;font-weight:700;margin-right:auto}#fc .subtitle{font-size:13px;color:#58616a;margin:8px 0}#fc .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;min-width:770px;border-left:1px solid var(--line)}#fc .cell{min-height:155px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}#fc .outside{background:#f3f2ed}#fc .weekday{font-size:12px;background:#eceee5;padding:8px;text-align:center;border-top:1px solid var(--line)}#fc .total{grid-column:1/-1;padding:7px 10px;background:#eceee5;font-size:12px;display:flex;justify-content:space-between}#fc .date{display:flex;align-items:center;justify-content:space-between}#fc .date button{padding:1px 5px;border:0;font-weight:700}#fc small{font-size:11px}#fc .phase{font-size:10px;line-height:1.3;border-left:3px solid #ff512c;padding:4px;background:#fff4e7;margin:4px 0}#fc .workout{display:block;width:100%;text-align:left;margin:5px 0;padding:6px;border:0;border-left:4px solid var(--sport);background:#f2f4f1;font-size:12px;line-height:1.4}#fc .workout b{display:block}#fc .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}#fc .week .cell{border:1px solid var(--line);border-radius:8px}#fc .slot{font-size:11px;font-weight:bold;margin-top:12px}#fc article{border:1px solid var(--line);border-left:4px solid var(--sport,#ff512c);padding:18px;margin:12px 0;border-radius:8px}#fc article h3{margin:4px 0}#fc article p{white-space:pre-wrap}#fc details{margin-top:12px}#fc dialog{width:min(680px,95vw);max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:20px}#fc dialog::backdrop{background:#17212888}#fc .phase-info{background:#f3f4ec;padding:15px;margin:12px 0}#fc .view-scroll{overflow:auto}@media(max-width:950px){#fc .week{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){#fc .week{grid-template-columns:1fr}}@media print{#fc .toolbar,#fc .filters,#fc .phases,#fc dialog{display:none}#fc .cell,#fc article{break-inside:avoid}}
</style><h2>Training calendar</h2><div class="subtitle" data-role="meta"></div><nav class="phases" aria-label="Training phases"></nav><div class="toolbar"><button data-action="prev" aria-label="Previous calendar period">←</button><button data-action="next" aria-label="Next calendar period">→</button><button data-action="start">Plan start</button><span class="heading" aria-live="polite"></span><button data-view="month">Month</button><button data-view="week">Week</button><button data-view="day">Day</button></div><div class="filters"><label>Jump to date <input type="date" data-role="date"></label><label>Sport <select data-role="sport"><option value="">All sessions</option></select></label><strong data-role="week-total"></strong></div><div class="view-scroll" data-role="view"></div><div data-role="phase-info"></div><p class="subtitle">Select a workout for details or a date for its daily view. Totals include all planned training, regardless of sport filter; race minutes are separate. Recorded activities remain separate from the plan.</p><dialog><button data-action="close">Close</button><div data-role="dialog-body"></div></dialog></section>
<script type="application/json" id="fc-data">__CALENDAR_DATA__</script><script>
(()=>{const root=document.getElementById('fc'),S=JSON.parse(document.getElementById('fc-data').textContent),q=s=>root.querySelector(s),colors={Run:'#ba512e',Bike:'#356798',Swim:'#247c77',Strength:'#84629a',Other:'#777b63',Rest:'#999',Race:'#ad8025'},rows=S.sessions||[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=s=>new Date(s+'T12:00:00Z'),iso=d=>d.toISOString().slice(0,10),add=(s,n)=>{let d=dt(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)},mon=s=>add(s,-((dt(s).getUTCDay()+6)%7)),fmt=(s,o={month:'short',day:'numeric'})=>dt(s).toLocaleDateString('en-US',{...o,timeZone:'UTC'}),dur=n=>{n=Math.round(n);return n?`${Math.floor(n/60)?Math.floor(n/60)+'h ':''}${n%60?n%60+'m':''}`.trim():'0h'};
let current=S.goal.startDate,view='month',sport='';const all=d=>rows.filter(x=>x.date===d),shown=d=>all(d).filter(x=>!sport||x.sport===sport),total=r=>r.filter(x=>x.sport!=='Race').reduce((n,x)=>n+x.minutes,0),phase=d=>S.trainingBlocks.find(b=>b.startDate<=d&&d<=b.endDate),inPlan=d=>S.goal.startDate<=d&&d<=S.goal.endDate;
function pill(d){let p=phase(d);return p?`<div class="phase">${esc(p.focus)}</div>`:''}
function button(x){return `<button class="workout" data-session="${esc(x.id)}" style="--sport:${colors[x.sport]||'#777'}"><b>${esc(x.title)}</b><small>${esc(x.slot)} · ${dur(x.minutes)}${x.provisional?' · provisional':''}</small></button>`}
function card(x){return `<article style="--sport:${colors[x.sport]||'#777'}"><small>${esc(x.date)} · ${esc(x.slot)} · ${esc(x.sport)} · ${dur(x.minutes)}</small><h3>${esc(x.title)}</h3><p>${x.provisional?'Provisional — review before execution.':'Detailed prescription.'}</p>${[['Intensity',x.intensity],['Purpose',x.purpose],['Prescription',x.details],['Success cue',x.successCue],['Easier alternative',x.alternative]].filter(a=>a[1]).map(([k,v])=>`<b>${k}</b><p>${esc(v)}</p>`).join('')}</article>`}
function cell(d,mo){return `<div class="cell ${dt(d).getUTCMonth()!==mo?'outside':''}"><div class="date"><button data-day="${d}" aria-label="Open ${fmt(d,{month:'long',day:'numeric',year:'numeric'})}">${dt(d).getUTCDate()}</button><small>${inPlan(d)?dur(total(all(d))):''}</small></div>${pill(d)}${shown(d).map(button).join('')}</div>`}
function month(){let d=dt(current),mo=d.getUTCMonth(),a=iso(new Date(Date.UTC(d.getUTCFullYear(),mo,1))),b=iso(new Date(Date.UTC(d.getUTCFullYear(),mo+1,0))),html='<div class="grid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let w=mon(a);w<=b;w=add(w,7)){let week=rows.filter(x=>w<=x.date&&x.date<=add(w,6));html+=`<div class="total"><span>Week of ${fmt(w)}${w<S.goal.startDate||add(w,6)>S.goal.endDate?' · partial plan week':''}</span><b>${dur(total(week))}${week.some(x=>x.sport==='Race')?' + race':''}</b></div>`;for(let i=0;i<7;i++)html+=cell(add(w,i),mo)}return html+'</div>'}
function week(){let w=mon(current);return '<div class="week">'+Array.from({length:7},(_,i)=>{let d=add(w,i);return `<div class="cell"><div class="date"><button data-day="${d}">${fmt(d,{weekday:'short',day:'numeric'})}</button><small>${dur(total(all(d)))}</small></div>${pill(d)}${['AM','PM','Rest','Race'].map(slot=>{let r=shown(d).filter(x=>x.slot===slot);return r.length?`<div class="slot">${esc(slot)}</div>${r.map(button).join('')}`:''}).join('')}</div>`}).join('')+'</div>'}
function render(){const weeklyDuration=dur(total(rows.filter(x=>mon(current)<=x.date&&x.date<=add(mon(current),6))));q('.heading').textContent=view==='month'?fmt(current,{month:'long',year:'numeric'}):view==='week'?fmt(mon(current))+' — '+fmt(add(mon(current),6))+' · '+weeklyDuration+' planned':fmt(current,{weekday:'long',month:'short',day:'numeric'});q('[data-role="date"]').value=current;q('[data-role="week-total"]').textContent=view==='week'?'':'Selected week: '+weeklyDuration;q('[data-role="view"]').innerHTML=view==='month'?month():view==='week'?week():shown(current).map(card).join('')||'<p>No matching sessions.</p>';root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));let b=phase(current);q('[data-role="phase-info"]').innerHTML=b?`<div class="phase-info"><b>${esc(b.focus)}</b><p>${esc(b.rationale)}</p>${(b.checkpoints||[]).map(c=>`<p><b>${esc(c.date)} checkpoint:</b> ${esc(c.criterion)} · ${esc(c.status)}</p>`).join('')}<details><summary>Progress / repeat / reduce</summary><p>${esc(b.progressIf)}</p><p>${esc(b.repeatIf)}</p><p>${esc(b.reduceIf)}</p></details></div>`:'';root.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{q('[data-role="dialog-body"]').innerHTML=card(rows.find(x=>x.id===b.dataset.session));q('dialog').showModal()});root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{view='day';move(b.dataset.day)})}
function move(d){current=d<S.goal.startDate?S.goal.startDate:d>S.goal.endDate?S.goal.endDate:d;render()}
q('[data-role="meta"]').textContent=`Version ${S.version} · ${S.status} · ${S.timezone} · ${S.goal.startDate} — ${S.goal.endDate}`;q('.phases').innerHTML=S.trainingBlocks.map(b=>`<button data-phase="${esc(b.startDate)}">${esc(b.focus)} · ${fmt(b.startDate)}</button>`).join('');root.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>move(b.dataset.phase));root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});q('[data-action="start"]').onclick=()=>move(S.goal.startDate);['prev','next'].forEach(a=>q(`[data-action="${a}"]`).onclick=()=>{let n=a==='prev'?-1:1;if(view==='month'){let d=dt(current);d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);move(iso(d))}else move(add(current,n*(view==='week'?7:1)))});let input=q('[data-role="date"]');input.min=S.goal.startDate;input.max=S.goal.endDate;input.onchange=e=>{if(e.target.value)move(e.target.value)};q('[data-role="sport"]').innerHTML+=[...new Set(rows.map(x=>x.sport))].sort().map(x=>`<option>${esc(x)}</option>`).join('');q('[data-role="sport"]').onchange=e=>{sport=e.target.value;render()};q('[data-action="close"]').onclick=()=>q('dialog').close();render();})();
</script>
