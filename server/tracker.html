<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Training tracker · Forge226</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f3ed;
        --white: #fff;
        --ink: #202820;
        --muted: #526151;
        --line: #d8ddd2;
        --pine: #344a38;
        --pale: #e7eee4;
        --clay: #a64629;
        --swim: #197773;
        --bike: #36648c;
        --run: #ad4f31;
        --strength: #795e89;
        --other: #747c68;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.52 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      select,
      input,
      textarea {
        border: 1px solid #bcc6b9;
        border-radius: 8px;
        padding: 0.49rem 0.76rem;
        background: white;
      }
      button,
      select,
      summary {
        cursor: pointer;
      }
      button:hover,
      button:focus-visible,
      summary:hover {
        background: #edf1e9;
      }
      :focus-visible {
        outline: 3px solid #ad572b;
        outline-offset: 3px;
      }
      button:disabled,
      input:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button.primary {
        color: white;
        background: var(--pine);
        border-color: var(--pine);
      }
      button.primary:hover {
        background: #223a28;
      }
      button.quiet {
        background: none;
        border-color: transparent;
        color: var(--pine);
        text-decoration: underline;
      }
      button[aria-pressed="true"] {
        border-color: var(--pine);
        background: var(--pine);
        color: #fff;
      }
      button.round {
        padding: 0 0.78rem;
        font-size: 1.2rem;
      }
      input[type="date"] {
        min-width: 0;
      }
      textarea {
        width: 100%;
        min-height: 64px;
      }
      input[type="checkbox"] {
        width: 1.1rem;
        height: 1.1rem;
        accent-color: var(--pine);
      }
      a {
        color: var(--pine);
      }
      .shell {
        max-width: 1370px;
        margin: 0 auto;
        padding: 24px clamp(14px, 3vw, 46px) 65px;
      }
      .mast,
      .bar,
      .row,
      .tools,
      .mix,
      .chart-tools,
      .legend,
      .picker {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .mast,
      .bar,
      .row {
        justify-content: space-between;
      }
      .mast {
        padding: 4px 0 19px;
        border-bottom: 1px solid var(--line);
      }
      .mast a {
        font-weight: 650;
        text-decoration: none;
        border-bottom: 1px solid #a5b1a1;
      }
      .brand {
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: var(--pine);
      }
      .hint,
      .small,
      .muted {
        color: var(--muted);
      }
      .small,
      small {
        font-size: 0.84rem;
      }
      .hint,
      .muted {
        margin: 0.3rem 0;
      }
      .bar {
        align-items: flex-end;
        margin: 26px 0 12px;
      }
      .period {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(2rem, 4.2vw, 3.6rem);
        letter-spacing: -0.055em;
        line-height: 1.05;
      }
      h2 {
        font-size: clamp(1.3rem, 2vw, 1.75rem);
        letter-spacing: -0.035em;
      }
      h3 {
        font-size: 1.08rem;
        letter-spacing: -0.018em;
      }
      h4 {
        font-size: 0.94rem;
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 9px 2px 12px;
        margin: 8px 0 8px;
      }
      .tabs button,
      .picker button {
        white-space: nowrap;
      }
      .tabs button {
        border-radius: 30px;
      }
      .status {
        min-height: 1.25rem;
        color: var(--pine);
        font-size: 0.88rem;
        margin: 3px 0;
      }
      .status.error {
        color: #943d26;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 12px 0;
      }
      .metric,
      .panel,
      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 13px;
      }
      .metric {
        padding: 15px 18px;
        min-width: 0;
      }
      .metric strong {
        display: block;
        font-size: clamp(1.55rem, 3vw, 2.4rem);
        line-height: 1.18;
        letter-spacing: -0.04em;
      }
      .metric span,
      .metric small {
        color: var(--muted);
      }
      .metric.focus {
        background: var(--pine);
        color: white;
        border-color: var(--pine);
      }
      .metric.focus span,
      .metric.focus small {
        color: #e0e7da;
      }
      .panel {
        padding: clamp(14px, 2.1vw, 24px);
        margin: 14px 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .grid > .panel {
        margin: 0;
      }
      .card {
        padding: 14px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 12px;
        margin-top: 14px;
      }
      .card b {
        display: block;
        font-size: 1.17rem;
      }
      .scroll {
        overflow-x: auto;
        margin: 8px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        font-size: 0.78rem;
        color: var(--muted);
        font-weight: 650;
      }
      th:first-child,
      td:first-child {
        padding-left: 0;
      }
      th:last-child,
      td:last-child {
        padding-right: 0;
      }
      .discipline {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
        background: var(--other);
      }
      .run {
        background: var(--run);
      }
      .bike {
        background: var(--bike);
      }
      .swim {
        background: var(--swim);
      }
      .strength {
        background: var(--strength);
      }
      .pill {
        display: inline-block;
        border-radius: 20px;
        background: #edf0e9;
        color: var(--pine);
        padding: 2px 8px;
        font-size: 0.77rem;
        font-weight: 600;
      }
      .pill.partial,
      .pill.missed {
        background: #f6e6dc;
        color: #804026;
      }
      .entry {
        display: flex;
        width: 100%;
        gap: 12px;
        align-items: center;
        text-align: left;
        background: white;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding: 12px 2px;
      }
      .entry .summary {
        flex: 1;
        min-width: 0;
      }
      .entry small {
        display: block;
        color: var(--muted);
      }
      .entry time {
        font-variant-numeric: tabular-nums;
        font-size: 0.83rem;
        min-width: 46px;
      }
      .entry strong {
        display: block;
      }
      .entry:last-child {
        border-bottom: 0;
      }
      .empty {
        color: var(--muted);
        padding: 0.8rem 0;
      }
      .legend {
        font-size: 0.81rem;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .legend i {
        display: inline-block;
        width: 16px;
        height: 0;
        border-top: 3px solid currentColor;
      }
      .chart {
        width: 100%;
        height: 265px;
        display: block;
      }
      .chart-tools {
        margin: 0.8rem 0;
      }
      .field {
        display: grid;
        gap: 4px;
        font-size: 0.88rem;
        font-weight: 600;
      }
      .field input,
      .field select,
      .field textarea {
        font-weight: 400;
        width: 100%;
        min-width: 0;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .wide {
        grid-column: 1/-1;
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .checks {
        display: grid;
        gap: 5px;
        max-height: 16rem;
        overflow: auto;
      }
      .checks label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 0.3rem 0;
      }
      .checks input {
        flex: none;
      }
      .week-title {
        font-weight: 650;
      }
      .callout {
        border-left: 3px solid var(--clay);
        padding: 8px 12px;
        background: #fcf6ef;
        margin: 10px 0;
      }
      .review-item {
        border-top: 1px solid var(--line);
        padding: 11px 0;
      }
      .review-item:first-of-type {
        margin-top: 10px;
      }
      .group {
        margin-top: 14px;
      }
      .date-label {
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.73rem;
        font-weight: 750;
        color: var(--muted);
      }
      ul {
        padding-left: 1.1rem;
        margin: 0.5rem 0;
      }
      li + li {
        margin-top: 0.35rem;
      }
      .foot {
        font-size: 0.84rem;
        color: var(--muted);
        margin: 0.5rem 0;
      }
      dialog {
        width: min(660px, calc(100% - 22px));
        max-height: 86vh;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--ink);
        padding: 0;
        background: white;
        box-shadow: 0 18px 70px #10181034;
      }
      dialog::backdrop {
        background: #18231aae;
      }
      .dialog-head {
        position: sticky;
        top: 0;
        background: white;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        z-index: 1;
      }
      .dialog-body {
        padding: 18px 20px;
      }
      .dialog-body section + section {
        border-top: 1px solid var(--line);
        padding-top: 13px;
        margin-top: 13px;
      }
      summary {
        padding: 6px 0;
        color: var(--pine);
        font-weight: 600;
      }
      .scroll-table {
        max-height: 380px;
        overflow: auto;
      }
      .scroll-table thead {
        position: sticky;
        top: 0;
        background: white;
      }
      .file {
        display: none;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 760px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .bar {
          align-items: flex-start;
        }
        .tabs {
          margin-top: 4px;
        }
        .shell {
          padding: 14px 12px 36px;
        }
        .metric,
        .panel {
          padding: 13px;
        }
        .entry {
          gap: 6px;
        }
        .fields {
          grid-template-columns: 1fr;
        }
        .chart {
          height: 210px;
        }
      }
      @media print {
        button,
        .tabs,
        .tools,
        .status,
        dialog,
        .chart-tools {
          display: none !important;
        }
        .shell {
          max-width: none;
        }
        .panel,
        .metric {
          break-inside: avoid;
        }
        .chart {
          height: 200px;
        }
      }

      .week-volume {
        margin: 0.9rem 0 1.15rem;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px 20px;
      }
      .volume-heading {
        grid-column: 1/-1;
        color: var(--muted);
        font-size: 0.83rem;
      }
      .volume-cell {
        min-width: 0;
      }
      .volume-time {
        float: right;
        color: var(--muted);
        font-size: 0.84rem;
        font-variant-numeric: tabular-nums;
      }
      .volume-track {
        background: #f2f2ec;
        border-radius: 4px;
        height: 9px;
        position: relative;
        overflow: hidden;
        margin-top: 5px;
      }
      .volume-track > span {
        position: absolute;
        inset: 0 auto 0 0;
      }
      .target-fill {
        background: #d8dfd4;
      }
      .observed-fill {
        border-radius: 3px;
      }
      @media (max-width: 650px) {
        .week-volume {
          grid-template-columns: 1fr;
        }
        .volume-heading {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="mast">
        <div class="brand">FORGE226</div>
        <div class="tools">
          <a href="/plan" target="_blank" rel="noopener">Open plan</a
          ><span id="version" class="small"></span
          ><button id="upload">Import FIT</button
          ><input id="fit-file" class="file" type="file" accept=".fit" /><button
            class="primary"
            id="sync"
          >
            Sync Garmin
          </button>
        </div>
      </header>
      <div class="bar">
        <div>
          <h1>Training tracker</h1>
          <p class="hint" id="freshness">Loading training records…</p>
        </div>
        <div class="period">
          <button class="round" id="previous" aria-label="Previous week">
            ‹</button
          ><label class="small">Week of <input type="date" id="week" /></label
          ><button class="round" id="next" aria-label="Next week">›</button
          ><button id="today">This week</button>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Tracking views"></nav>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="view" aria-busy="true"></div>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="row dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="close" aria-label="Close dialog">Close ×</button>
      </div>
      <div class="dialog-body" id="dialog-content"></div>
    </dialog>
    <script>
      "use strict";
      const TOKEN = __TRACKER_TOKEN__;
      const $ = (id) => document.getElementById(id);
      const pages = [
        "Week",
        "Workouts",
        "Training load",
        "Performance",
        "Race readiness",
        "Recovery",
        "Weekly review",
      ];
      const state = {
        snapshot: null,
        tab: "Week",
        sport: "All",
        pmcSport: "All",
        health: "hrvMs",
        range: 84,
        busy: false,
      };
      let readId = 0;
      function el(tag, props = {}, ...children) {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (v === undefined || v === null) continue;
          if (k === "class") n.className = v;
          else if (k.startsWith("on"))
            n.addEventListener(k.slice(2).toLowerCase(), v);
          else if (k === "style") Object.assign(n.style, v);
          else if (k in n && !k.startsWith("aria")) n[k] = v;
          else n.setAttribute(k, v);
        }
        for (const child of children.flat(Infinity)) {
          if (child !== null && child !== undefined)
            n.append(
              child instanceof Node
                ? child
                : document.createTextNode(String(child)),
            );
        }
        return n;
      }
      const btn = (label, click, cls = "") =>
        el("button", { type: "button", class: cls, onclick: click }, label);
      const text = (v, cls = "") => el("p", { class: cls }, v);
      const msg = (v) => text(v, "empty");
      const panel = (title, ...kids) =>
        el("section", { class: "panel" }, el("h2", {}, title), kids);
      const finite = (v) =>
        v !== null && v !== undefined && v !== "" && Number.isFinite(Number(v));
      const num = (v, d = 0) =>
        finite(v)
          ? Number(v).toLocaleString(undefined, { maximumFractionDigits: d })
          : "—";
      const duration = (m) =>
        finite(m)
          ? (Math.round(m) >= 60
              ? Math.floor(Math.round(m) / 60) +
                "h " +
                (Math.round(m) % 60 ? (Math.round(m) % 60) + "m" : "")
              : Math.round(m) + "m"
            ).trim()
          : "—";
      const dateOf = (d) => new Date(d + "T12:00:00Z");
      const iso = (d) => d.toISOString().slice(0, 10);
      const shift = (s, n) => {
        const d = dateOf(s);
        d.setUTCDate(d.getUTCDate() + n);
        return iso(d);
      };
      const shortDate = (s) =>
        s && /^\d{4}-\d{2}-\d{2}/.test(s)
          ? dateOf(s.slice(0, 10)).toLocaleDateString(undefined, {
              month: "short",
              day: "numeric",
              timeZone: "UTC",
            })
          : "—";
      const valueOr = (v, alt = "—") =>
        v === null || v === undefined || v === "" ? alt : String(v);
      function discipline(s) {
        return el(
          "span",
          { class: "discipline" },
          el("i", {
            class:
              "dot " +
              (["run", "bike", "swim", "strength"].includes(
                String(s).toLowerCase(),
              )
                ? s.toLowerCase()
                : "other"),
          }),
          s || "Other",
        );
      }
      function distance(m, s) {
        if (!finite(m)) return "—";
        return String(s).toLowerCase() === "swim"
          ? num(m / 0.9144) + " yd"
          : num(m / 1609.344, 1) + " mi";
      }
      function list(items, empty) {
        return items?.length
          ? el(
              "ul",
              {},
              items.map((v) => el("li", {}, String(v))),
            )
          : msg(empty);
      }
      function table(head, rows) {
        return el(
          "div",
          { class: "scroll" },
          el(
            "table",
            {},
            el(
              "thead",
              {},
              el(
                "tr",
                {},
                head.map((x) => el("th", { scope: "col" }, x)),
              ),
            ),
            el(
              "tbody",
              {},
              rows.map((row) =>
                el(
                  "tr",
                  {},
                  row.map((x) => el("td", {}, x)),
                ),
              ),
            ),
          ),
        );
      }
      function metric(label, value, caption, focus = false) {
        return el(
          "div",
          { class: "metric" + (focus ? " focus" : "") },
          el("span", {}, label),
          el("strong", {}, value),
          el("small", {}, caption),
        );
      }
      function notify(s, error = false) {
        $("status").textContent = s;
        $("status").className = "status" + (error ? " error" : "");
      }
      function modal(title, ...content) {
        $("dialog-title").textContent = title;
        $("dialog-content").replaceChildren(...content.flat().filter(Boolean));
        if (!$("dialog").open) $("dialog").showModal();
      }
      function closeModal() {
        if ($("dialog").open) $("dialog").close();
      }
      $("close").onclick = closeModal;
      $("dialog").addEventListener("click", (e) => {
        if (e.target === $("dialog")) {
          const r = e.target.getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            closeModal();
        }
      });
      function fields() {
        return el("div", { class: "fields" });
      }
      function field(label, input, wide = false) {
        return el(
          "label",
          { class: "field" + (wide ? " wide" : "") },
          label,
          input,
        );
      }
      function selection(values, current) {
        return el(
          "select",
          {},
          values.map((x) => {
            const [v, label] = Array.isArray(x) ? x : [x, x];
            return el(
              "option",
              { value: v, selected: String(v) === String(current) },
              label,
            );
          }),
        );
      }
      function setBusy(on) {
        state.busy = on;
        for (const id of [
          "sync",
          "upload",
          "previous",
          "next",
          "today",
          "week",
        ])
          $(id).disabled = on;
        document
          .querySelectorAll("[data-write]")
          .forEach((b) => (b.disabled = on));
      }
      async function jsonResponse(r) {
        const t = await r.text();
        let j;
        try {
          j = JSON.parse(t);
        } catch {
          throw Error(
            "The local tracker returned an unreadable response. Reopen it from your coaching session.",
          );
        }
        if (!r.ok || j.error)
          throw Error(j.error || "Request failed (" + r.status + ")");
        return j;
      }
      async function load(week, quiet = false) {
        const id = ++readId;
        const q = week ? "?week=" + encodeURIComponent(week) : "";
        if (!quiet) notify("Loading week…");
        $("view").setAttribute("aria-busy", "true");
        try {
          const r = await fetch("/api/tracking" + q, {
            headers: { "X-Tracker-Token": TOKEN },
            cache: "no-store",
          });
          const snap = await jsonResponse(r);
          if (id !== readId) return;
          state.snapshot = snap;
          $("week").value = snap.week;
          $("version").textContent = "Active plan v" + snap.version;
          $("freshness").textContent =
            snap.freshness || "Garmin sync time unavailable";
          render();
          if (!quiet) notify("");
        } catch (e) {
          if (id === readId) notify(e.message, true);
          throw e;
        } finally {
          if (id === readId) $("view").setAttribute("aria-busy", "false");
        }
      }

          const w = canvas.clientWidth,
            h = canvas.clientHeight;
          if (!w || !h) return;
          const ratio = Math.min(window.devicePixelRatio || 1, 3);
          canvas.width = Math.round(w * ratio);
          canvas.height = Math.round(h * ratio);
          const c = canvas.getContext("2d");
          c.scale(ratio, ratio);
          const values = points.flatMap((p) =>
            visible
              .map((l) => l.get(p))
              .filter(finite)
              .map(Number),
          );
          const min = Math.min(0, ...values),
            max = Math.max(min + 1, ...values);
          const left = 44,
            right = w - 12,
            top = 10,
            bottom = h - 32;
          const t = points.map((p) => dateOf(p.date).getTime());
          const start = t[0],
            end = t[t.length - 1];
          const x = (i) =>
            left +
            (right - left) *
              (end === start ? 0.5 : (t[i] - start) / (end - start));
          const y = (v) => bottom - ((bottom - top) * (v - min)) / (max - min);
          c.font = "12px system-ui";
          c.fillStyle = "#526151";
          c.textAlign = "right";
          for (let n = 0; n <= 4; n++) {
            const val = min + ((max - min) * n) / 4,
              at = y(val);
            c.fillText(num(val), left - 5, at + 4);
            c.strokeStyle = "#e1e5df";
            c.beginPath();
            c.moveTo(left, at);
            c.lineTo(right, at);
            c.stroke();
          }
          c.textAlign = "left";
          c.fillText(shortDate(points[0].date), left, bottom + 20);
          c.textAlign = "right";
          c.fillText(
            shortDate(points[points.length - 1].date),
            right,
            bottom + 20,
          );
          for (const l of visible) {
            c.beginPath();
            c.strokeStyle = l.color;
            c.lineWidth = l.dash ? 1.7 : 2.4;
            c.setLineDash(l.dash ? [6, 4] : []);
            let pen = false;
            points.forEach((p, i) => {
              const v = l.get(p);
              if (!finite(v)) {
                pen = false;
                return;
              }
              if (pen) c.lineTo(x(i), y(v));
              else c.moveTo(x(i), y(v));
              pen = true;
            });
            c.stroke();
            c.setLineDash([]);
            if (points.length === 1 && finite(l.get(points[0]))) {
              c.fillStyle = l.color;
              c.beginPath();
              c.arc(x(0), y(l.get(points[0])), 3, 0, Math.PI * 2);
              c.fill();
            }
          }
          c.strokeStyle = "#7f8b7e";
          c.lineWidth = 1;
          c.beginPath();
          c.moveTo(x(selected), top);
          c.lineTo(x(selected), bottom);
          c.stroke();
          const p = points[selected];
          readout.textContent = [
            shortDate(p.date),
            ...visible.map((l) => l.label + " " + num(l.get(p), 1)),
          ].join(" · ");
        }
        cursor.oninput = () => {
          selected = Number(cursor.value);
          draw();
        };
        canvas.onclick = (e) => {
          const rect = canvas.getBoundingClientRect();
          const frac = Math.max(
            0,
            Math.min(1, (e.clientX - rect.left - 44) / (rect.width - 56)),
          );
          const start = dateOf(points[0].date).getTime(),
            end = dateOf(points[points.length - 1].date).getTime();
          const goal = start + (end - start) * frac;
          selected = points.reduce(
            (best, p, i) =>
              Math.abs(dateOf(p.date) - goal) <
              Math.abs(dateOf(points[best].date) - goal)
                ? i
                : best,
            0,
          );
          cursor.value = selected;
          draw();
        };
        figure.append(legend, canvas, cursor, readout);
        requestAnimationFrame(draw);
        if (window.ResizeObserver) {
          const observer = new ResizeObserver(() => {
            if (canvas.isConnected) draw();
            else observer.disconnect();
          });
          observer.observe(canvas);
        }
        return figure;
      }

          ]);
        const status =
          typeof estimate.status === "string"
            ? estimate.status
            : "Awaiting race-specific evidence.";
        return panel(
          "Race-day estimate",
          text(status, "muted"),
          rows.length
            ? table(
                ["Leg", "Fast end", "Central", "Slow end", "Basis", "Evidence"],
                rows,
              )
            : null,
          estimate.note ? text(estimate.note, "foot") : null,
          estimate.missing?.length
            ? text(
                "Still needed: " + estimate.missing.join(", "),
                "small muted",
              )
            : null,
          writeBtn("Log race evidence", () => raceEvidenceForm(s), "control"),
        );
      }
      function raceEvidenceForm(s, selected) {
        const activities = s.activities.filter(
          (a) => s.week <= a.date && a.date < shift(s.week, 7),
        );
        if (!activities.length) {
          modal(
            "Log race evidence",
            msg("Select a week with a recorded swim, ride, run or transition."),
          );
          return;
        }
        const recording = selection(
          activities.map((a) => [a.id, shortDate(a.date) + " · " + a.name]),
          selected?.id || activities[0].id,
        );
        const leg = selection(
          ["Swim", "Bike", "Run", "T1", "T2"],
          selected?.sport || activities[0].sport,
        );
        const seconds = el("input", {
          type: "number",
          required: true,
          min: 1,
          max: 86400,
          step: 1,
        });
        const meters = el("input", {
            type: "number",
            min: 0,
            max: 1000000,
            step: "any",
          }),
          context = el("textarea", {
            maxLength: 600,
            required: true,
            placeholder:
              "Include conditions, effort and how the segment was measured.",
          });
        const confirm = el("input", { type: "checkbox" }),
          hint = el("span");
        const setLeg = () => {
          if (leg.value === "Bike")
            hint.textContent =
              "This was an outdoor ride at sustainable race effort.";
          else if (leg.value === "Run")
            hint.textContent =
              "This run followed a ride and was at sustainable 70.3 effort.";
          else
            hint.textContent =
              "This was a measured race-rhythm segment or transition.";
          confirm.required = true;
          confirm.checked = false;
          meters.required = !["T1", "T2"].includes(leg.value);
        };
        recording.onchange = () => {
          const a = activities.find((a) => a.id === recording.value);
          if (["Swim", "Bike", "Run"].includes(a?.sport)) leg.value = a.sport;
          setLeg();
        };
        leg.onchange = setLeg;
        setLeg();
        modal(
          "Log measured race evidence",
          formBox(
            el(
              "div",
              { class: "fields" },
              field("Source activity", recording, true),
              field("Leg", leg),
              field("Segment duration (seconds)", seconds),
              field("Measured distance (meters)", meters),
              field("Conditions and measurement", context, true),
              el("label", { class: "wide" }, confirm, " ", hint),
            ),
            () => {
              const a = activities.find((a) => a.id === recording.value);
              mutate(
                "result",
                {
                  activityId: a.id,
                  date: a.date,
                  name: a.name,
                  sport: leg.value,
                  leg: leg.value,
                  distanceMeters: Number(meters.value) || 0,
                  seconds: Number(seconds.value),
                  minutes: Number(seconds.value) / 60,
                  context: context.value.trim(),
                  source: "Athlete measured",
                  outdoor: leg.value === "Bike",
                  brick: leg.value === "Run",
                },
                "Evidence recorded.",
              );
            },
          ),
        );
      }

      function render() {
        const s = state.snapshot;
        if (!s) return;
        nav();
        const views = {
          Week: overview,
          Workouts: weekEntries,
          "Training load": loadView,
          Performance: performance,
          "Race readiness": race,
          Recovery: recovery,
          "Weekly review": review,
        };
        $("view").replaceChildren(...views[state.tab](s).filter(Boolean));
      }
      gotoWeek();
    </script>
  </body>
</html>
